<figure>
<table role="grid">
    <thead>
        <tr>
            <th></th>
            <th>Title</th>
            <th>Price</th>
            <th>Type</th>
            <th>Attributes</th>
            <th>Seller</th>
            <th>Fetched</th>
        </tr>
    </thead>
    <tbody>
        {% for offer in offers %}
        <tr>
            <td class="thumb-cell">
                {% if offer.thumbnail_url %}
                <a href="{% url 'offer_detail' offer.id %}">
                    <img src="{{ offer.thumbnail_url }}" alt="" class="list-thumb" loading="lazy">
                </a>
                {% endif %}
            </td>
            <td><a href="{% url 'offer_detail' offer.id %}">{{ offer.title|truncatechars:60 }}</a></td>
            <td class="price">
                {{ offer.price|floatformat:0 }} {{ offer.currency }}
                {% if offer.vs_avg_label %}
                <br><small class="vs-avg {% if offer.vs_avg_cheap %}vs-cheap{% else %}vs-expensive{% endif %}">{{ offer.vs_avg_label }}</small>
                {% endif %}
            </td>
            <td>
                {% if offer.is_bike == 1 %}
                    <span class="badge badge-bike">bike</span>
                {% elif offer.is_bike == 0 %}
                    <span class="badge badge-noise">noise</span>
                {% else %}
                    <span class="badge badge-none">?</span>
                {% endif %}
            </td>
            <td class="attr-cell">
                {% if offer.listing_type == "SPONSORED" %}
                    <span class="badge badge-none">ad</span>
                {% endif %}
            </td>
            <td>{{ offer.seller_login }}</td>
            <td>{{ offer.fetched_at|slice:":10" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="7" class="empty-row">No offers match the current filters.</td></tr>
        {% endfor %}
    </tbody>
</table>
</figure>

{% if is_paginated %}
<nav class="pagination" aria-label="Pagination">
    <ul>
        {% if page_obj.has_previous %}
        <li>
            <a href="?page={{ page_obj.previous_page_number }}{% for k, v in request.GET.items %}{% if k != 'page' %}&{{ k }}={{ v }}{% endif %}{% endfor %}">&laquo; Prev</a>
        </li>
        {% endif %}
        <li class="page-info">Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</li>
        {% if page_obj.has_next %}
        <li>
            <a href="?page={{ page_obj.next_page_number }}{% for k, v in request.GET.items %}{% if k != 'page' %}&{{ k }}={{ v }}{% endif %}{% endfor %}">Next &raquo;</a>
        </li>
        {% endif %}
    </ul>
</nav>
{% endif %}
